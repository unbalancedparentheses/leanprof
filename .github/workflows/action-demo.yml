# The leanprof GitHub Action (action.yml) on this repository's own example:
# every pull request gets a comment comparing copybug's copies, allocations,
# calls, compile heartbeats and time between its base and head commits.
name: Action demo
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: action-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  leanprof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          executable: copybug
          args: "2000"
          allocs: true
          elab-files: Examples/CopyBug.lean Examples/ElabHeavy.lean
          fail-on: copies,heartbeats
