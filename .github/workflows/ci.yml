name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: LEANPROF_QUIET=1 lake test
      - name: Example report
        run: |
          lake build copybug
          LEANPROF_JSON=report.json .lake/build/bin/copybug 2000
          cat report.json
          grep -q '"shared":1999' report.json
          grep -q '"pos":"Examples/CopyBug.lean:15"' report.json
      - name: Automatic mode and dependency-wide copy detection
        run: |
          find .lake -name '*.c.o*' -delete
          LEANPROF_AUTO=1 LEAN_CC=$PWD/scripts/leanprof-cc lake build copybug
          LEANPROF_JSON=auto.json .lake/build/bin/copybug 2000
          cat auto.json
          grep -q '"name":"buildWithHistory","pos":"Examples/CopyBug.lean:15","auto":true' auto.json
          grep -q '"name":"fib","pos":"Examples/CopyBug.lean:10","auto":true' auto.json
          grep -q '"shared":1999' auto.json
