name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: LEANPROF_QUIET=1 lake test
      - name: Example report
        run: |
          lake build copybug
          LEANPROF_JSON=report.json .lake/build/bin/copybug 2000
          cat report.json
          grep -q '"shared":1999' report.json
          grep -q '"name":"buildWithHistory","pos":"Examples/CopyBug.lean:17"' report.json
      - name: Allocations
        run: |
          LEANPROF_QUIET=1 lake exe leanprof run --allocs --json allocs.json copybug -- 2000
          python3 -c "import json,sys; d=json.load(open('allocs.json')); n=sum(a['allocs'] for a in d['allocations']); print(n); sys.exit(0 if n > 0 else 1)"
      - name: Reuse and closure counters
        run: |
          LEANPROF_QUIET=1 lake exe leanprof run --counters --json counters.json copybug -- 2000
          python3 -c "import json,sys; d=json.load(open('counters.json')); c=sum(r['checks'] for r in d['reuse']); a=sum(r['applications'] for r in d['closures']); print(c,a); sys.exit(0 if c >= 2000 and a > 0 else 1)"
          LEANPROF_QUIET=1 lake exe leanprof run --json plain.json copybug -- 2000
          python3 -c "import json,sys; d=json.load(open('plain.json')); sys.exit(0 if d['reuse'] == [] and d['closures'] == [] else 1)"
      - name: Frees, memory and leanprof stat
        run: |
          LEANPROF_QUIET=1 lake exe leanprof run --frees --json frees.json --trace frees-trace.json copybug -- 2000
          python3 - <<'PY'
          import json, sys
          d = json.load(open('frees.json'))
          f, m = d['frees'], d['memory']
          print({k: f[k] for k in ('cascades', 'objects', 'max_ns')}, {k: m[k] for k in ('peak_commit', 'peak_rss', 'samples')})
          rise = {s['name']: s['max_rise'] for s in m['scopes']}
          print(rise)
          ev = json.load(open('frees-trace.json'))['traceEvents']
          counters = sum(e['ph'] == 'C' for e in ev)
          slow = [e['name'] for e in ev if e['ph'] == 'X']
          print(counters, slow)
          ok = (f['objects'] >= 2000 and m['peak_commit'] > 15 * 2**20 and m['samples'] >= 2
                and rise.get('buildWithHistory', 0) > 10 * 2**20 and counters >= 2)
          sys.exit(0 if ok else 1)
          PY
          lake exe leanprof stat copybug -- 2000 | tee stat.txt
          grep -q "peak memory" stat.txt
          grep -q "copies       1,999 of shared values" stat.txt
          grep -q "frees        [0-9,]* objects in" stat.txt
          grep -q "top scopes   .*buildWithHistory" stat.txt
      - name: Tasks
        run: |
          lake build tasks
          LEANPROF_JSON=tasks.json .lake/build/bin/tasks
          cat tasks.json
          grep -q '"spawned_by":"pureTasks","tasks":16' tasks.json
          grep -q '"spawned_by":"ioTasks","tasks":16' tasks.json
          grep -q '"waits":16' tasks.json
      - name: Task continuations (Task.map/bind, IO.mapTask/bindTask)
        run: |
          lake build taskchains
          LEANPROF_JSON=chains.json .lake/build/bin/taskchains 20000
          cat chains.json
          grep -q '"spawned_by":"mapped","tasks":16' chains.json
          grep -q '"spawned_by":"bound","tasks":24' chains.json
          grep -q '"spawned_by":"ioMapped","tasks":8' chains.json
          grep -q '"spawned_by":"ioBound","tasks":16' chains.json
      - name: Core-library coverage (run --core)
        run: |
          if [ "$RUNNER_OS" = macOS ] && ! ls /opt/homebrew/opt/llvm*/bin/llvm-objcopy; then brew install llvm; fi
          LEANPROF_QUIET=1 lake exe leanprof run --json plain.json corecopies -- 1000
          LEANPROF_QUIET=1 lake exe leanprof run --core --json core.json corecopies -- 1000
          LEANPROF_QUIET=1 lake exe leanprof run --core --json core2.json corecopies -- 1000 2>&1 | tee cached.txt
          grep -q "(cached)" cached.txt
          if grep -q '"function":"Array.append"' plain.json; then echo "core copy seen without --core"; exit 1; fi
          grep -q '"function":"Array.append","symbol":"[^"]*","scope":"appendShared","where":"","kind":"Array","copies":500,' core.json
          # references renamed, nothing defined under the shims' names, the runtime untouched
          lib=$(ls -d .lake/leanprof/core/*/ | head -1)
          nm "$lib/libInit.a" | grep -Eq ' U _?leanprof_array_push$'
          if nm "$lib/libInit.a" | grep -Eq ' U _?lean_array_push$'; then exit 1; fi
          if nm "$lib/libInit.a" "$lib/libLean.a" | grep -Eq ' [TDS] _?leanprof_'; then exit 1; fi
          test ! -e "$lib/libleanrt.a"
      - name: Timeline trace
        run: |
          LEANPROF_QUIET=1 LEANPROF_TRACE=trace.json .lake/build/bin/copybug 300
          python3 -c "import json,sys; d=json.load(open('trace.json'))['traceEvents']; b=sum(e['ph']=='B' for e in d); e=sum(e['ph']=='E' for e in d); c=sum(e['ph']=='i' for e in d); print(b,e,c); sys.exit(0 if b==e and b>10000 and c>=299 else 1)"
      - name: Automatic mode and dependency-wide copy detection
        run: |
          find .lake -name '*.c.o*' -delete
          LEANPROF_AUTO=1 LEAN_CC=$PWD/scripts/leanprof-cc lake build copybug
          LEANPROF_JSON=auto.json .lake/build/bin/copybug 2000
          cat auto.json
          grep -q '"name":"buildWithHistory","pos":"Examples/CopyBug.lean:17","auto":true' auto.json
          grep -q '"name":"fib","pos":"Examples/CopyBug.lean:12","auto":true' auto.json
          grep -q '"shared":1999' auto.json
      - name: leanprof run and compare
        run: |
          LEANPROF_QUIET=1 lake exe leanprof run --json small.json copybug -- 1000
          LEANPROF_QUIET=1 lake exe leanprof run --json large.json copybug -- 2000
          lake exe leanprof compare small.json small.json
          if lake exe leanprof compare small.json large.json; then echo "expected a regression"; exit 1; fi
      - name: report-md (the pull-request comment of the GitHub Action)
        run: |
          lake exe leanprof report-md small.json small.json | tee same.md
          grep -q '✅ no regressions' same.md
          grep -q '| copies | 999 | 999 | 0 | ✅ pass |' same.md
          if lake exe leanprof report-md small.json large.json > worse.md; then echo "expected a regression"; exit 1; fi
          cat worse.md
          grep -q '| copies | 999 | 1,999 | +1,000 (+100.10%) | ❌ fail |' worse.md
          grep -q '| calls | 10,948 | 10,948 | 0 | ✅ pass |' worse.md
          grep -q '`buildWithHistory (in Std.Legacy.Range.forIn.\{0,1\}.loop) \[Array\] in buildWithHistory`' worse.md
          lake exe leanprof report-md --fail-on none small.json large.json | grep -q '| copies | 999 | 1,999 | +1,000 (+100.10%) | ⚠️ worse (not enforced) |'
          if lake exe leanprof report-md --fail-on bogus small.json large.json; then echo "expected an error"; exit 1; fi
      - name: Autoresearch demo (measure and judge)
        run: sh research/demo/run.sh
      - name: Inlay hints through the language server
        run: |
          LEANPROF_QUIET=1 lake exe leanprof run copybug -- 2000
          lake exe leanprof elab Examples/CopyBug.lean
          echo '#leanprof' >> Examples/CopyBug.lean
          python3 scripts/lsp-hints.py "$PWD" Examples/CopyBug.lean | tee hints.txt
          git checkout Examples/CopyBug.lean
          grep -q "line 17: ⏱" hints.txt
          grep -q "line 17: ⚠ 1999 copies" hints.txt
          grep -q "line 17: ⚙ .* to compile" hints.txt
      - name: Compile-time analysis
        run: |
          lake exe leanprof elab --heartbeats --threshold 0 Examples/ElabHeavy.lean | tee elab.txt
          grep -q "repeated work" elab.txt
          # the definitions behind the work, located in Lean's sources; tactic lines
          grep -q "isDefEq unfolds  Lean.Omega.Coeffs.isZero  (Init/Omega/Coeffs.lean:" elab.txt
          grep -q "whnf reduces     List.foldl  (Init/Prelude.lean:" elab.txt
          grep -q "instance tried   instHAdd  (Init/Prelude.lean:" elab.txt
          grep -q "Examples/ElabHeavy.lean:28  refine" elab.txt
          lake exe leanprof elab --heartbeats --counts --out counts.json Examples/ElabHeavy.lean | tee counts.txt
          grep -q "most unfolded" counts.txt
          python3 - <<'PY'
          import json, sys
          d = json.load(open('.lake/leanprof/elab.json'))
          c = {x['name']: x for x in d['constants']}
          k = {x['name']: x for x in json.load(open('counts.json'))['constants']}
          print(c.get('List.foldl'), k.get('List.rec'))
          line = [s for s in d['scopes'] if s['pos'] == 'Examples/ElabHeavy.lean:19'][0]
          ok = (k['List.rec']['kernel'] > 100 and c['List.foldl']['where'].startswith('Init/Prelude.lean:')
                and any(u['name'] == 'List.foldl' for u in line['unfolded'])
                and any(t['pos'] == 'Examples/ElabHeavy.lean:22' for t in d['tactics']))
          sys.exit(0 if ok else 1)
          PY
          cp .lake/leanprof/elab.json base.json
          lake exe leanprof elab --heartbeats --threshold 0 Examples/ElabHeavy.lean
          lake exe leanprof compare base.json .lake/leanprof/elab.json
          sed -i.bak 's/(List.range 40).foldl (· + ·) 0 = 780/(List.range 60).foldl (· + ·) 0 = 1770/' Examples/ElabHeavy.lean
          lake exe leanprof elab --heartbeats --threshold 0 Examples/ElabHeavy.lean
          git checkout Examples/ElabHeavy.lean
          if lake exe leanprof compare base.json .lake/leanprof/elab.json; then echo "expected a regression"; exit 1; fi
          lake exe leanprof report-md --fail-on none base.json .lake/leanprof/elab.json | tee elab.md
          grep -q '| compile heartbeats |.*| ⚠️ worse (not enforced) |' elab.md
          if lake exe leanprof report-md --fail-on heartbeats base.json .lake/leanprof/elab.json > /dev/null; then echo "expected a regression"; exit 1; fi
      - name: Compile-time analysis of a whole project (elab --project)
        run: |
          lake exe leanprof elab --project --heartbeats --out proj1.json | tee proj.txt
          grep -q "slowest files" proj.txt
          grep -q "definitions behind the work" proj.txt
          lake exe leanprof elab --project --heartbeats --module-glob 'Leanprof.*' --out glob.json
          python3 - <<'PY'
          import json, sys
          p, g = json.load(open('proj1.json')), json.load(open('glob.json'))
          mods = {f['module'] for f in p['files']}
          gm = {f['module'] for f in g['files']}
          print(sorted(mods), sorted(gm))
          ok = (p['project'] and {'Leanprof.Core', 'Leanprof.Editor'} <= mods
                and gm and all(m.startswith('Leanprof.') for m in gm)
                and any(c['where'].startswith('Init/') for c in p['constants']))
          sys.exit(0 if ok else 1)
          PY
          # heartbeats repeat: a second run is no regression, per declaration and per module
          lake exe leanprof elab --project --heartbeats --no-build --out proj2.json > /dev/null
          lake exe leanprof compare proj1.json proj2.json | tee cmp.txt
          grep -q "module Leanprof.Editor" cmp.txt
          # a module made slower is a regression
          python3 - <<'PY'
          import json
          d = json.load(open('proj2.json'))
          for f in d['files']:
              if f['module'] == 'Leanprof.Editor':
                  f['total_ns'] *= 1.5
          json.dump(d, open('proj3.json', 'w'))
          PY
          if lake exe leanprof compare proj1.json proj3.json; then echo "expected a regression"; exit 1; fi
      - name: Sampling (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install samply
          lake exe leanprof sample --top 5 copybug -- 15000 | tee sample.txt
          grep -q "copying non-exclusive values" sample.txt
          grep -q "buildWithHistory  (Examples/CopyBug.lean:17)" sample.txt

  # leanprof used from outside on real projects that do not depend on it.
  # leanprover-community/repl, pinned to its v4.35.0 tag (the Lean version
  # leanprof is built with): an executable that depends only on Lean core
  # (no Mathlib), builds in about a minute, has inputs that make it do real
  # work (elaborating Lean code), and links all of Lean, so its ~400k symbols
  # cover escapes, private and hygienic names, instances and specializations.
  # Tests/OddNames adds what it lacks: a package name with escapes
  # (`odd-names_v2`) and declarations with unusual names.
  real-projects:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build leanprof and demangle-check
        run: |
          lake build leanprof demangle-check tests
          echo "LP=$PWD/.lake/build/bin" >> "$GITHUB_ENV"
          echo "CHECK=$PWD/scripts/check-report.py" >> "$GITHUB_ENV"
      - name: Demangler against Lean's on leanprof's binaries
        run: $LP/demangle-check $LP/leanprof $LP/tests
      - name: Unusual names (Tests/OddNames)
        working-directory: Tests/OddNames
        run: |
          lake build odd
          $LP/demangle-check .lake/build/bin/odd
          $LP/leanprof run --auto --json odd.json odd -- 10
          python3 $CHECK odd.json --min-pos 5 --expect "«top level»=OddNames/Basic.lean" \
            --expect "«ελ»=OddNames/Basic.lean" --expect Odd.callAll=OddNames/Basic.lean \
            --expect Odd.secretSum=OddNames/Basic.lean
      - name: Clone and build leanprover-community/repl
        run: |
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/repl.git "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl"
          lake build repl
      - name: Demangler against Lean's on repl
        working-directory: ${{ runner.temp }}/repl
        run: $LP/demangle-check .lake/build/bin/repl
      - name: leanprof run on repl
        working-directory: ${{ runner.temp }}/repl
        run: |
          $LP/leanprof run --auto --json run.json repl < test/all_tactics.in > run.out
          python3 $CHECK run.json --min-pos 10 --expect repl=REPL/Main.lean \
            --expect REPL.runCommand=REPL/Main.lean
      - name: leanprof sample on repl (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/repl
        run: |
          brew install samply
          $LP/leanprof sample --top 15 repl < test/all_tactics.in > sample.txt
          sed -n '/^leanprof sample/,$p' sample.txt
          grep -q "repl  (REPL/Main.lean:" sample.txt
          python3 $CHECK .lake/leanprof/report.json --min-pos 3 --expect repl=REPL/Main.lean
      - name: leanprof elab on repl
        working-directory: ${{ runner.temp }}/repl
        run: |
          $LP/leanprof elab --heartbeats REPL/JSON.lean REPL/Main.lean > elab.txt
          head -30 elab.txt
          python3 $CHECK .lake/leanprof/elab.json --elab --min-pos 5
          grep -q '"pos":"REPL/Main.lean:' .lake/leanprof/elab.json
