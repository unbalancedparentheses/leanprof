# The website (https://unbalancedparentheses.github.io/leanprof), generated
# from the repository's Markdown by website/build.py. Every push and pull
# request builds it and checks its links; a push to main also deploys it.
name: Pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Install the pinned Markdown and highlighting libraries
        run: pip install -r website/requirements.txt
      - name: Build
        run: python3 website/build.py --out _site
      - name: Check links, anchors and images
        run: python3 website/check.py _site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
