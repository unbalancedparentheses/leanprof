# leanprof as a new user gets it: packaged as a release archive, installed
# with the install script (piped, as from curl), its source build hidden,
# then run on projects leanprof has never been tuned for, at pinned tags:
#   import-graph   an executable that loads Lean modules at run time
#                  (run with allocations, explain, sample on macOS)
#   lean4-cli      a library on an older Lean than leanprof's own (elab)
# Runs on changes to what is installed, weekly, and by hand.
name: Fresh install
on:
  push:
    branches: [main]
    paths:
      - "c/**"
      - "scripts/**"
      - "**.lean"
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/fresh-install.yml
  pull_request:
    paths:
      - "c/**"
      - "scripts/**"
      - "**.lean"
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/fresh-install.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SRC: ${{ github.workspace }}/leanprof-src
      TAG: v0.0.0-fresh
    steps:
      - uses: actions/checkout@v4
        with:
          path: leanprof-src
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and package, as a release would
        working-directory: leanprof-src
        run: |
          lake build leanprof
          sh scripts/package-release.sh "$TAG" "${{ matrix.platform }}"
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Install with the install script, then hide the source build
        run: |
          cd "$RUNNER_TEMP"
          LEANPROF_HOME="$RUNNER_TEMP/home" LEANPROF_DOWNLOAD="file://$SRC/dist" \
            sh -s -- --release "$TAG" --bin "$RUNNER_TEMP/bin" < "$SRC/scripts/install.sh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # the installed command must not need the build it came from
          mv "$SRC/.lake" "$SRC/.lake-hidden"
          cp "$SRC/scripts/check-report.py" "$RUNNER_TEMP/check-report.py"
      - name: Install samply (macOS)
        if: runner.os == 'macOS'
        run: brew install samply
      - name: import-graph (v4.35.0)
        run: |
          git clone --quiet --depth 1 --branch v4.35.0 https://github.com/leanprover-community/import-graph.git "$RUNNER_TEMP/ig"
          cd "$RUNNER_TEMP/ig"
          leanprof doctor
          lake build
          lake exe graph --to ImportGraph plain.dot
          # under leanprof the program must still find the modules it loads, and write the same graph
          leanprof run --allocs --json run.json graph -- --to ImportGraph profiled.dot
          cmp plain.dot profiled.dot
          python3 - run.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          copies = [c for c in r.get("copies", []) if "ImportGraph/" in str(c.get("where", ""))]
          allocs = r.get("allocs") or r.get("allocations") or []
          assert copies, "no copy site in the project's own files"
          assert allocs, "allocations were not counted"
          print(f"{len(copies)} copy sites in import-graph, {len(allocs)} allocation sites")
          PY
          leanprof explain --report run.json | tee explain.txt
          grep -q "ImportGraph/" explain.txt
      - name: import-graph, sampled (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/ig
        run: |
          leanprof sample --top 15 graph -- --to ImportGraph sampled.dot > sample.txt
          sed -n '/^leanprof sample/,$p' sample.txt
          cmp plain.dot sampled.dot
      - name: lean4-cli on Lean 4.34.0 (compile time)
        run: |
          git clone --quiet --depth 1 --branch v4.34.0 https://github.com/leanprover/lean4-cli.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          lake build
          leanprof elab --heartbeats --top 5 Cli/Basic.lean
          python3 "$RUNNER_TEMP/check-report.py" .lake/leanprof/elab.json --elab --min-pos 5
