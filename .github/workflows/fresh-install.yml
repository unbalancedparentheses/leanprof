# leanprof as a new user gets it: packaged as a release archive, installed
# with the install script (piped, as from curl), its source build hidden,
# then run on projects leanprof has never been tuned for, at pinned tags:
#   import-graph   an executable that loads Lean modules at run time
#                  (`leanprof` with no arguments, run with allocations,
#                  explain, sample on macOS)
#   lean4-cli      a library on an older Lean than leanprof's own
#                  (`leanprof` with no arguments: compile time; elab)
# samply comes from the installer (--samply), not a package manager. On
# Linux with perf events closed, `leanprof` falls back to `leanprof stat`.
# Runs on changes to what is installed, weekly, and by hand.
name: Fresh install
on:
  push:
    branches: [main]
    paths:
      - "c/**"
      - "scripts/**"
      - "**.lean"
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/fresh-install.yml
  pull_request:
    paths:
      - "c/**"
      - "scripts/**"
      - "**.lean"
      - lakefile.lean
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/fresh-install.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SRC: ${{ github.workspace }}/leanprof-src
      TAG: v0.0.0-fresh
    steps:
      - uses: actions/checkout@v4
        with:
          path: leanprof-src
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and package, as a release would
        working-directory: leanprof-src
        run: |
          lake build leanprof
          sh scripts/package-release.sh "$TAG" "${{ matrix.platform }}"
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Install with the install script, then hide the source build
        run: |
          cd "$RUNNER_TEMP"
          LEANPROF_HOME="$RUNNER_TEMP/home" LEANPROF_DOWNLOAD="file://$SRC/dist" \
            sh -s -- --release "$TAG" --bin "$RUNNER_TEMP/bin" --samply < "$SRC/scripts/install.sh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # the installed command must not need the build it came from
          mv "$SRC/.lake" "$SRC/.lake-hidden"
          cp "$SRC/scripts/check-report.py" "$RUNNER_TEMP/check-report.py"
          # samply is the one the installer fetched, not one on PATH
          if command -v samply; then echo "::error::samply is on PATH"; exit 1; fi
          "$RUNNER_TEMP/home/samply/samply" --version
      - name: import-graph (v4.35.0), with no arguments
        run: |
          git clone --quiet --depth 1 --branch v4.35.0 https://github.com/leanprover-community/import-graph.git "$RUNNER_TEMP/ig"
          cd "$RUNNER_TEMP/ig"
          leanprof doctor | tee doctor.txt
          grep -q "samply 0.13.1 at $RUNNER_TEMP/home/samply/samply" doctor.txt
          # three executables: listed with how to pick one, none chosen
          rc=0; leanprof > choose.txt || rc=$?
          cat choose.txt
          test "$rc" = 2
          grep -q "leanprof graph -- ARGS" choose.txt
          grep -q "leanprof unused_transitive_imports -- ARGS" choose.txt
          if grep -q "top findings" choose.txt; then exit 1; fi
          lake build
          lake exe graph --to ImportGraph plain.dot
          # the one picked: sampled (no rebuild) where perf events allow it, else counted with probes
          leanprof graph -- --to ImportGraph quick.dot | tee quick.txt
          cmp plain.dot quick.dot
          if [ "$RUNNER_OS" = macOS ]; then
            grep -q "leanprof sample --top 8 graph" quick.txt
            grep -q "  1\. .*(MainGraph.lean:\|  1\. .*(ImportGraph/" quick.txt
          elif [ "$(cat /proc/sys/kernel/perf_event_paranoid)" -gt 1 ]; then
            grep -q "cannot sample here: perf events" quick.txt
            grep -q "leanprof stat graph" quick.txt
          else
            grep -q "leanprof sample --top 8 graph" quick.txt
          fi
          grep -q "top findings" quick.txt
          grep -q "leanprof run graph -- --to ImportGraph quick.dot" quick.txt
          grep -q "leanprof fix --exe graph -- --to ImportGraph quick.dot" quick.txt
      - name: import-graph (v4.35.0)
        run: |
          cd "$RUNNER_TEMP/ig"
          lake exe graph --to ImportGraph plain.dot
          # under leanprof the program must still find the modules it loads, and write the same graph
          leanprof run --allocs --json run.json graph -- --to ImportGraph profiled.dot
          cmp plain.dot profiled.dot
          python3 - run.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          copies = [c for c in r.get("copies", []) if "ImportGraph/" in str(c.get("where", ""))]
          allocs = r.get("allocs") or r.get("allocations") or []
          assert copies, "no copy site in the project's own files"
          assert allocs, "allocations were not counted"
          print(f"{len(copies)} copy sites in import-graph, {len(allocs)} allocation sites")
          PY
          leanprof explain --report run.json | tee explain.txt
          grep -q "ImportGraph/" explain.txt
      - name: import-graph, sampled (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/ig
        run: |
          leanprof sample --top 15 graph -- --to ImportGraph sampled.dot > sample.txt
          sed -n '/^leanprof sample/,$p' sample.txt
          cmp plain.dot sampled.dot
      - name: lean4-cli on Lean 4.34.0 (compile time)
        run: |
          git clone --quiet --depth 1 --branch v4.34.0 https://github.com/leanprover/lean4-cli.git "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          # no executable: `leanprof` profiles compile time of the libraries
          leanprof | tee noargs.txt
          grep -q "no executable in this project; profiling compile time of its libraries (Cli, CliTest)" noargs.txt
          grep -q "  1\. .* (Cli/" noargs.txt
          grep -q "leanprof elab --heartbeats Cli/" noargs.txt
          python3 "$RUNNER_TEMP/check-report.py" .lake/leanprof/elab.json --elab --min-pos 5
          leanprof elab --heartbeats --top 5 Cli/Basic.lean
          python3 "$RUNNER_TEMP/check-report.py" .lake/leanprof/elab.json --elab --min-pos 5
