# Releases. On a version tag (v0.1.0, ...): build the leanprof command for
# macOS arm64 and x86-64 and Linux x86-64 and arm64, test the packaged command and the install
# script on a project outside this repository, package the VS Code extension,
# and create a GitHub release with the archives, the .vsix, SHA256SUMS, and
# the version's CHANGELOG.md section as notes. See RELEASING.md.
#
# Everything else is a dry run, which does all of that except creating the
# release: a push that changes what a release is made of, or a manual run
# (Actions > Release > Run workflow). The dry run's "would-be release" is
# kept as an artifact.
name: Release
on:
  push:
    tags: ["v[0-9]*"]
    branches: ["**"]
    # branch pushes run only when these change (path filters do not apply to tags)
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/package-release.sh
      - scripts/version-smoke.sh
      - editors/vscode/**
      - lakefile.lean
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package as (default: lakefile.lean's), dry run: nothing is published"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          lake_version=$(sed -n 's/^ *version := v!"\(.*\)"$/\1/p' lakefile.lean)
          vsix_version=$(python3 -c "import json; print(json.load(open('editors/vscode/package.json'))['version'])")
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"; publish=true
          else
            tag="${INPUT:-v$lake_version}"; publish=false
          fi
          echo "tag $tag, publish $publish; lakefile $lake_version, extension $vsix_version"
          # the tag, the lakefile and the extension name one version
          if [ "$publish" = true ] && { [ "v$lake_version" != "$tag" ] || [ "v$vsix_version" != "$tag" ]; }; then
            echo "::error::tag $tag but lakefile.lean has $lake_version and editors/vscode/package.json $vsix_version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          # the oldest supported runners, so the binary runs on older glibc
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build leanprof
      - name: Package
        run: echo "ARCHIVE=$(sh scripts/package-release.sh "$TAG" "${{ matrix.platform }}")" >> "$GITHUB_ENV"
      - name: Install it with the install script
        run: |
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
          # the script as users run it (piped, so not as a clone), from this archive,
          # with the pinned samply it fetches (checksum-verified) for this platform
          LEANPROF_HOME="$RUNNER_TEMP/home" LEANPROF_DOWNLOAD="file://$PWD/dist" \
            sh -s -- --release "$TAG" --bin "$RUNNER_TEMP/bin" --samply < scripts/install.sh
          "$RUNNER_TEMP/bin/leanprof" help | grep -q report-md
          "$RUNNER_TEMP/home/samply/samply" --version
      - name: Smoke test the installed command on a project outside this repository
        run: |
          sample=""
          if [ "$RUNNER_OS" = macOS ]; then sample=--sample; fi
          sh scripts/version-smoke.sh "$RUNNER_TEMP/bin/leanprof" "$(cat lean-toolchain)" $sample
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # the one-command install as a user runs it today: the latest release if
  # there is one for the platform, otherwise a clone of main built from source
  install-latest:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install with this branch's script, piped as from curl
        run: |
          sh -s < scripts/install.sh
          ~/.local/bin/leanprof help | grep -q report-md
          ~/.local/bin/leanprof doctor || true

  vscode:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the VS Code extension
        working-directory: editors/vscode
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          npm ci
          npm run package -- -o "../../leanprof-${TAG#v}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: leanprof-*.vsix
          if-no-files-found: error

  publish:
    needs: [version, build, vscode]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          # the section headed "## [X.Y.Z]" or "## X.Y.Z" for tag vX.Y.Z
          awk -v v="${TAG#v}" '
            /^## / { if (on) exit; on = (index($0, "[" v "]") || $2 == v) ; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
          cat notes.md
          (cd dist && sha256sum *.tar.gz *.vsix > SHA256SUMS && cat SHA256SUMS)
          ls -l dist
          test "$(ls dist/*.tar.gz | wc -l)" -eq 4
          test "$(ls dist/*.vsix | wc -l)" -eq 1
      - name: Create the release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.vsix dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "leanprof $TAG" --notes-file notes.md
      - name: Dry run (nothing published)
        if: needs.version.outputs.publish != 'true'
        run: |
          {
            echo "## Dry run: the release $TAG would have"
            echo
            echo '```'
            ls -l dist
            echo '```'
            echo
            echo "and these notes:"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p would-be-release && cp dist/* notes.md would-be-release/
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'true'
        with:
          name: would-be-release-${{ env.TAG }}
          path: would-be-release
